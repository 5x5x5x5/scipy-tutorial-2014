[project]
name = "scipy-tutorial-reproducible-research"
version = "2.0.0"
description = "Reproducible Research: Walking the Walk - A hands-on tutorial updated for modern tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "SimpleITK",
    "jupyterlab>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nbval",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions",
]

[tool.pytest.ini_options]
testpaths = ["notebooks/dexy/test"]

[tool.uv]
default-groups = ["dev", "docs"]
