site_name: "Reproducible Research: Walking the Walk"
site_description: A hands-on tutorial on reproducible research practices and tools
site_url: https://reproducible-research.github.io/scipy-tutorial-2014/
repo_url: https://github.com/reproducible-research/scipy-tutorial-2014
repo_name: reproducible-research/scipy-tutorial-2014

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Preparation: Preparation.md
  - Agenda: agenda.md
  - Sessions:
      - Data Acquisition: DataAcquisition.md
      - Data Sharing: DataSharing.md
      - Computational Environment: ComputationalEnvironment.md
      - Data Processing: DataProcessing.md
      - Revision Control: RevisionControl.md
      - Testing: Testing.md
      - Literate Programming: LiterateProgramming.md
      - Workflow: Workflow.md

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
